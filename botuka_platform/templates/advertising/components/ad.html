{% if entrega %}{% with criativo=entrega.criativo campanha=entrega.campanha %}
{% if campanha.plano.nivel == 0 %}<div class="botuka-ad-takeover" data-ad-takeover data-duration="{{ campanha.plano.duracao_segundos }}" role="dialog" aria-modal="true" aria-label="Publicidade"><div class="botuka-ad-takeover__backdrop"></div><article class="botuka-ad-takeover__content"><button type="button" data-ad-close aria-label="Fechar publicidade">×</button>{% include 'advertising/components/creative.html' %}</article></div><script>(function(){const root=document.currentScript.previousElementSibling;if(!root)return;const close=()=>root.remove();root.querySelector('[data-ad-close]').addEventListener('click',close);window.setTimeout(close,Math.max(1,Number(root.dataset.duration)||8)*1000)})();</script>
{% else %}<aside class="ad-slot ad-slot--{{ format|default:'leaderboard' }}" aria-label="Publicidade"><span>Publicidade</span>{% include 'advertising/components/creative.html' %}</aside>{% endif %}
<style>.botuka-ad-takeover{position:fixed;inset:0;z-index:1080;display:grid;place-items:center;padding:1rem}.botuka-ad-takeover__backdrop{position:absolute;inset:0;background:rgba(0,0,0,.78)}.botuka-ad-takeover__content{position:relative;max-width:min(960px,96vw);max-height:92vh;background:#fff;border-radius:14px;padding:1rem;overflow:auto}.botuka-ad-takeover__content>[data-ad-close]{position:absolute;right:.35rem;top:.25rem;z-index:2;border:0;border-radius:50%;font-size:1.8rem;line-height:1;background:#fff}.botuka-ad-media{display:block;max-width:100%;height:auto}.botuka-ad-link{display:block;color:inherit;text-decoration:none}.botuka-ad-copy{padding:.75rem}</style>
{% endwith %}{% endif %}
