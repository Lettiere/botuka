<a class="botuka-ad-link" href="{% url 'advertising_public:entrega_clique' entrega.uuid %}" rel="nofollow sponsored noopener">{% if criativo.tipo == 'IMAGEM' %}<img class="botuka-ad-media" src="{{ criativo.imagem.url }}" alt="{{ criativo.titulo }}" loading="lazy">{% elif criativo.tipo == 'VIDEO' %}<video class="botuka-ad-media" autoplay muted loop playsinline controls><source src="{{ criativo.video.url }}"></video>{% else %}<div class="botuka-ad-copy"><strong>{{ criativo.titulo }}</strong><p>{{ criativo.texto }}</p></div>{% endif %}</a>
