<aside
  class="botuka-consent"
  data-consent-panel
  data-policy-version="{{ consent_policy_version }}"
  data-consent-max-age-days="{{ consent_max_age_days }}"
  hidden
  role="dialog"
  aria-modal="false"
  aria-labelledby="botuka-consent-title"
  aria-describedby="botuka-consent-description"
>
  <div class="botuka-consent__content">
    <strong id="botuka-consent-title">Sua privacidade importa</strong>
    <p id="botuka-consent-description">
      Em conformidade com a Lei Geral de Proteção de Dados (LGPD), utilizamos
      cookies essenciais para o funcionamento da plataforma. Cookies de
      analytics e marketing são opcionais e somente serão ativados com seu
      consentimento. Você poderá alterar sua escolha em “Privacidade”.
    </p>
  </div>
  <div class="botuka-consent__actions">
    <button type="button" class="btn-botuka btn-soft" data-consent="essential">
      Somente essenciais
    </button>
    <button type="button" class="btn-botuka btn-yellow" data-consent="all">
      Aceitar todos
    </button>
  </div>
</aside>
