<!-- MAPA + PUBLICAR -->
  <section class="showcase-section">
    <div class="container-botuka">
      <div class="main-layout">

        <section class="map-card reveal" id="mapa" style="min-width:0;">
          <div class="section-title mb-2">
            <div>
              <h2>Mapa da cidade</h2>
              <small>Encontre o que está perto de você</small>
            </div>
          </div>

          <div class="fake-map">
            <div class="map-road"></div>

            <button class="map-pin pin-service" type="button"><i class="bi bi-tools"></i></button>
            <button class="map-pin pin-event" type="button"><i class="bi bi-calendar-event-fill"></i></button>
            <button class="map-pin pin-tour" type="button"><i class="bi bi-binoculars-fill"></i></button>
            <button class="map-pin pin-job" type="button"><i class="bi bi-briefcase-fill"></i></button>
            <button class="map-pin pin-shop" type="button"><i class="bi bi-shop"></i></button>

            <div class="map-floating">
              <strong><i class="bi bi-geo-alt-fill" style="color:var(--botuka-earth)"></i> Agora perto de você</strong>
              <small>Serviços, eventos, vagas, empresas e avisos no mapa.</small>
            </div>
          </div>

          <div class="map-filters">
            <button class="map-filter active">Tudo</button>
            <button class="map-filter">Serviços</button>
            <button class="map-filter">Eventos</button>
            <button class="map-filter">Vagas</button>
            <button class="map-filter">Turismo</button>
            <button class="map-filter">Empresas</button>
          </div>
        </section>

        <aside class="publish-card reveal" id="publicar" style="min-width:0;">
          <h3>Publique na vitrine da cidade</h3>
          <p>Divulgue serviços, produtos, vagas, eventos, empresas e avisos regionais.</p>

          <div class="publish-grid" style="display:flex;flex-wrap:wrap;gap:14px;">
            <a href="#" class="publish-option" style="flex:1 1 160px;min-width:120px;"><i class="bi bi-tools"></i> Serviço</a>
            <a href="#" class="publish-option" style="flex:1 1 160px;min-width:120px;"><i class="bi bi-tag-fill"></i> Produto</a>
            <a href="#" class="publish-option" style="flex:1 1 160px;min-width:120px;"><i class="bi bi-briefcase-fill"></i> Vaga</a>
            <a href="#" class="publish-option" style="flex:1 1 160px;min-width:120px;"><i class="bi bi-calendar-event-fill"></i> Evento</a>
            <a href="#" class="publish-option" style="flex:1 1 160px;min-width:120px;"><i class="bi bi-shop"></i> Empresa</a>
            <a href="#" class="publish-option" style="flex:1 1 160px;min-width:120px;"><i class="bi bi-megaphone-fill"></i> Aviso</a>
          </div>
        </aside>

      </div>
    </div>
  </section>
