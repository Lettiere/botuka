{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}Gestão BOTUKA{% endblock %}</title>
  {% include "pwa/head.html" %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root{--bg:#f4f7fb;--panel:#fff;--line:#d9e1ec;--text:#1e293b;--muted:#64748b;--brand:#0f766e;--brand-strong:#115e59;--danger:#b91c1c}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:inherit;text-decoration:none}
    .gestao-shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
    .gestao-sidebar{background:#0f172a;color:#e2e8f0;padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto}
    .gestao-brand{font-weight:800;font-size:22px;letter-spacing:.02em;margin:4px 8px 22px}
    .gestao-menu{display:grid;gap:4px}
    .gestao-menu a{border-radius:8px;padding:10px 12px;color:#cbd5e1;font-size:14px}
    .gestao-menu a:hover,.gestao-menu a.is-active{background:#1e293b;color:#fff}
    .gestao-main{min-width:0}
    .gestao-topbar{height:64px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px}
    .gestao-topbar>div:last-child{display:flex;align-items:center;gap:14px}.gestao-return-site{min-height:42px;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-weight:800}.gestao-return-site:hover{border-color:var(--yellow);background:#fff8d6}.gestao-return-site:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}.gestao-return-site__mobile{display:none}
    .gestao-content{padding:24px;max-width:1440px;margin:0 auto}
    .page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .page-head h1{font-size:24px;line-height:1.2;margin:0}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
    .panel-pad{padding:18px}
    .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
    .stat{padding:18px;border:1px solid var(--line);border-radius:8px;background:#fff}
    .stat strong{display:block;font-size:28px;margin-top:8px}
    .toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
    .search{display:flex;gap:8px;min-width:min(100%,420px)}
    input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;background:#fff}
    textarea{min-height:110px}
    .table-wrap{overflow:auto}
    table{border-collapse:collapse;width:100%;font-size:14px}
    th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
    th{font-size:12px;text-transform:uppercase;color:var(--muted);background:#f8fafc}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:8px;padding:9px 12px;font-size:14px;font-weight:650;cursor:pointer}
    .btn-primary{background:var(--brand);color:#fff}
    .btn-primary:hover{background:var(--brand-strong)}
    .btn-soft{background:#eef6f5;color:var(--brand);border-color:#cce7e3}
    .btn-muted{background:#f8fafc;color:var(--text);border-color:var(--line)}
    .btn-danger{background:#fee2e2;color:var(--danger);border-color:#fecaca}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .form-field.full{grid-column:1 / -1}
    .form-field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#334155}
    .helptext{display:block;color:var(--muted);font-size:12px;margin-top:4px}
    .errorlist{color:var(--danger);font-size:13px;margin:0 0 6px;padding-left:18px}
    .alert{border-radius:8px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--line);background:#fff}
    .alert-success{border-color:#bbf7d0;background:#f0fdf4}
    .alert-error{border-color:#fecaca;background:#fef2f2}
    .pagination{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
    .access-user-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.access-user-summary>div{display:grid;gap:5px}.access-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin:16px 0}.access-card header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.access-card h2{margin:4px 0;font-size:18px}.access-module{color:var(--brand);font-size:12px;font-weight:800;text-transform:uppercase}.access-card dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.access-card dl div{display:grid;gap:3px}.access-card dt{color:var(--muted);font-size:12px}.access-card dd{margin:0;font-weight:650}.badge{display:inline-flex;width:max-content;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:750}.badge-success{background:#dcfce7;color:#166534}.badge-warning{background:#fef3c7;color:#92400e}.badge-danger{background:#fee2e2;color:#991b1b}.breadcrumb{margin-bottom:12px;color:var(--muted);font-size:13px}.permission-matrix{margin:20px 0}.permission-matrix fieldset{margin:0 0 14px;padding:14px;border:1px solid var(--line);border-radius:8px}.permission-matrix legend{padding:0 6px;font-weight:800}.permission-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.permission-option{display:flex;align-items:flex-start;gap:9px;padding:10px;border:1px solid var(--line);border-radius:8px}.permission-option input{width:auto;margin-top:3px}.permission-option span{display:grid;gap:2px}.permission-option small{color:var(--muted)}
    @media (max-width:900px){.gestao-shell{grid-template-columns:1fr}.gestao-sidebar{position:relative;height:auto}.gestao-menu{grid-template-columns:repeat(2,minmax(0,1fr))}.gestao-topbar{padding:0 16px}.gestao-content{padding:16px}.form-grid,.permission-options,.access-user-summary{grid-template-columns:1fr}.toolbar,.page-head{align-items:stretch;flex-direction:column}.search{min-width:0}}
    @media (max-width:600px){.gestao-return-site__desktop{display:none}.gestao-return-site__mobile{display:inline}.gestao-topbar>div:last-child>span:last-child{display:none}}
  </style>
</head>
<body>
  <div class="gestao-shell">
    {% include "gestao/components/sidebar.html" %}
    <main class="gestao-main">
      {% include "gestao/components/topbar.html" %}
      <section class="gestao-content">
        {% include "gestao/components/alerts.html" %}
        {% block content %}{% endblock %}
      </section>
    </main>
  </div>
  {% include "pwa/register.html" %}
  <script>document.addEventListener("submit",function(e){const m=e.target.dataset.confirm;if(m&&!window.confirm(m))e.preventDefault()});</script>
</body>
</html>
