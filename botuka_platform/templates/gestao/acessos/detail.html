{% extends "gestao/base.html" %}{% block content %}<div class="page-head"><div><h1>{{ title }} — {{ object }}</h1></div><div class="actions"><a class="btn btn-muted" href="{% url list_url_name %}">Voltar</a><a class="btn btn-primary" href="{% url edit_url_name object.pk %}">Editar</a></div></div><section class="panel panel-pad"><p><strong>Status:</strong> {{ object.ativo|yesno:"Ativo,Inativo" }}</p>{% if object.codigo %}<p><strong>Código:</strong> {{ object.codigo }}</p>{% endif %}<p>{{ object.descricao|default:"Sem descrição." }}</p><form method="post" action="{% url 'gestao:controle_status' kind object.pk %}">{% csrf_token %}<button class="btn {% if object.ativo %}btn-danger{% else %}btn-soft{% endif %}" type="submit">{% if object.ativo %}Inativar{% else %}Reativar{% endif %}</button></form></section>{% endblock %}
