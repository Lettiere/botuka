<aside class="gestao-sidebar" id="gestao-sidebar" aria-label="Navegação administrativa" aria-hidden="false">
  <div class="gestao-sidebar-head">
    <a class="gestao-brand" href="{% url 'gestao:dashboard' %}">BOTUKA <small>Gestão</small></a>
    <button class="gestao-sidebar-close" type="button" data-sidebar-close aria-label="Fechar menu"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
  </div>
  <nav class="gestao-menu" aria-label="Menu de gestão">
    {% for group in gestao_navigation %}
      <details class="gestao-menu-group{% if group.active %} is-active{% endif %}" {% if group.active or forloop.first %}open{% endif %}>
        <summary{% if group.active %} aria-current="true"{% endif %}><i class="bi {{ group.icon }}" aria-hidden="true"></i><span>{{ group.label }}</span><i class="bi bi-chevron-down gestao-menu-chevron" aria-hidden="true"></i></summary>
        <div class="gestao-menu-items">
          {% for item in group.items %}
            <a href="{{ item.url }}"{% if item.active %} class="is-active" aria-current="page"{% endif %}><i class="bi {{ item.icon }}" aria-hidden="true"></i><span>{{ item.label }}</span></a>
          {% endfor %}
        </div>
      </details>
    {% endfor %}
    <form class="gestao-logout" method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button type="submit"><i class="bi bi-box-arrow-right" aria-hidden="true"></i><span>Sair da Gestão</span></button></form>
  </nav>
</aside>
<button class="gestao-sidebar-backdrop" type="button" data-sidebar-close aria-label="Fechar menu" tabindex="-1" aria-hidden="true"></button>
