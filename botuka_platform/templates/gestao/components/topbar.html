<header class="gestao-topbar">
  <div>
    <button class="gestao-menu-toggle" type="button" data-sidebar-open aria-controls="gestao-sidebar" aria-expanded="false" aria-label="Abrir menu"><i class="bi bi-list" aria-hidden="true"></i></button>
    <strong id="gestao-page-section">{{ section|default:"Gestão" }}</strong>
  </div>
  <div>
    <a class="gestao-return-site" href="{% url 'home' %}">
      <i class="bi bi-house-door" aria-hidden="true"></i>
      <span class="gestao-return-site__desktop">Retornar ao site</span>
      <span class="gestao-return-site__mobile">Site</span>
    </a>
    <span>{{ request.user.get_full_name|default:request.user.email }}</span>
  </div>
</header>
