{% if is_paginated %}
  <nav class="pagination" aria-label="Paginação">
    {% if page_obj.has_previous %}
      <a class="btn btn-muted" href="?page={{ page_obj.previous_page_number }}{% if query %}&q={{ query }}{% endif %}">Anterior</a>
    {% endif %}
    <span class="btn btn-muted">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a class="btn btn-muted" href="?page={{ page_obj.next_page_number }}{% if query %}&q={{ query }}{% endif %}">Próxima</a>
    {% endif %}
  </nav>
{% endif %}
