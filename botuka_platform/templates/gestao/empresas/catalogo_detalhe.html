{% extends "gestao/base.html" %}{% block content %}<div class="page-head"><div><h1>{{ object.nome }}</h1><p>{{ object.codigo }}</p></div><a class="btn btn-muted" href="{% url 'gestao:empresa_catalogo_editar' kind object.pk %}">Editar</a></div><section class="panel panel-pad"><p>{{ object.descricao|default:"Sem descrição." }}</p><p><strong>Status:</strong> {{ object.ativo|yesno:"Ativo,Inativo" }}</p><form method="post" action="{% url 'gestao:empresa_catalogo_status' kind object.pk %}">{% csrf_token %}<button class="btn {% if object.ativo %}btn-danger{% else %}btn-soft{% endif %}" type="submit">{% if object.ativo %}Inativar{% else %}Reativar{% endif %}</button></form></section>{% endblock %}
