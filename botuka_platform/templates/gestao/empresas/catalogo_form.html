{% extends "gestao/base.html" %}{% block content %}<div class="page-head"><h1>{{ title }}</h1><a class="btn btn-muted" href="{% url 'gestao:empresa_catalogo_lista' kind %}">Voltar</a></div><form method="post" class="panel panel-pad">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="form-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field.errors }}{{ field }}{% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}</div>{% endfor %}<button class="btn btn-primary" type="submit">Salvar</button></form>{% endblock %}
