{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sessão expirada | BOTUKA</title>
  <link rel="stylesheet" href="{% static 'css/platform/style.css' %}">
</head>
<body>
  <main class="container py-5" style="max-width: 720px">
    <section class="panel panel-pad" role="alert">
      <h1>Sua sessão ou formulário expirou.</h1>
      <p>Atualize a página e tente novamente. Caso tenha feito login em outra aba, abra novamente o formulário antes de enviar.</p>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-primary" onclick="window.location.href = window.location.href">Recarregar página</button>
        {% if request.user.is_authenticated %}
          <a class="btn btn-outline-secondary" href="{% url 'painel:dashboard' %}">Voltar ao painel</a>
        {% else %}
          <a class="btn btn-outline-secondary" href="{% url 'home' %}">Voltar ao login</a>
        {% endif %}
      </div>
    </section>
  </main>
</body>
</html>
