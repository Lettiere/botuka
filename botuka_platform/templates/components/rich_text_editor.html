{% load static %}
<link rel="stylesheet" href="{% static 'components/rich-text-editor.css' %}">
<div class="richtext-editor" data-richtext>
  <div class="richtext-editor__toolbar" role="toolbar" aria-label="Formatação do conteúdo">
    <button type="button" data-command="formatBlock" data-value="p">Parágrafo</button>
    <button type="button" data-command="formatBlock" data-value="h2">H2</button>
    <button type="button" data-command="formatBlock" data-value="h3">H3</button>
    <button type="button" data-command="bold" aria-label="Negrito"><strong>B</strong></button>
    <button type="button" data-command="italic" aria-label="Itálico"><em>I</em></button>
    <button type="button" data-command="insertUnorderedList">• Lista</button>
    <button type="button" data-command="insertOrderedList">1. Lista</button>
    <button type="button" data-command="formatBlock" data-value="blockquote">Citação</button>
    <button type="button" data-command="createLink">Link</button>
    <button type="button" data-command="undo">Desfazer</button>
    <button type="button" data-command="redo">Refazer</button>
    <button type="button" data-command="removeFormat">Limpar</button>
  </div>
  <div class="richtext-editor__surface" contenteditable="true" role="textbox" aria-multiline="true" aria-label="{{ field.label }}" data-richtext-editor></div>
  {{ field }}
</div>
<script src="{% static 'components/rich-text-editor.js' %}" defer></script>
