<header class="app-header py-2 shadow-sm sticky-top">
  <nav class="container-botuka d-flex align-items-center justify-content-between flex-wrap gap-2">
    <a href="{% url 'home' %}" class="brand d-flex align-items-center gap-2 text-dark text-decoration-none" aria-label="BOTUKA início">
      <span class="brand-dot flex-shrink-0"></span>
      <span class="fw-bold fs-4">BOTUKA</span>
    </a>

    <div class="location-shell d-none" aria-hidden="true"></div>

    <form class="header-search d-flex align-items-center ms-2 flex-grow-1" id="headerSearch" role="search" method="get" action="{% url 'global_search' %}" style="max-width:390px;">
      <div class="input-group flex-nowrap">
        <span class="input-group-text bg-white border-end-0" id="search-icon"><i class="bi bi-search text-secondary"></i></span>
        <input type="search"
               name="q"
               value="{{ request.GET.q }}"
               class="form-control border-start-0"
               placeholder="Buscar na cidade..."
               aria-label="Buscar na cidade"
               aria-describedby="search-icon">
        <button class="visually-hidden" type="submit">Buscar</button>
      </div>
    </form>

    <div class="header-actions d-flex align-items-center gap-2 ms-auto flex-shrink-0">
      <button class="btn-botuka btn-soft btn-icon" id="themeToggle" type="button" aria-label="Alternar tema">
        <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
      </button>
      {% include "components/publicar_menu.html" %}
      {% if request.user.is_authenticated %}
        {% include "components/user_dropdown.html" %}
      {% else %}
        <button class="btn-botuka btn-soft d-flex align-items-center gap-2 py-2 px-3" data-bs-toggle="modal" data-bs-target="#loginModal" type="button">
          <i class="bi bi-person-circle" style="font-size:1.1rem;"></i>
          <span class="fw-semibold d-none d-md-inline">Entrar</span>
        </button>
      {% endif %}
    </div>
  </nav>
</header>
