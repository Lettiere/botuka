<button
  class="user-avatar-btn"
  type="button"
  data-navigation-open
  aria-expanded="false"
  aria-controls="userNavigationModal"
  aria-haspopup="dialog"
  aria-label="Abrir navegação da conta"
>
  {% if request.user.foto %}
    <img src="{{ request.user.foto.url }}" alt="">
  {% else %}
    <span aria-hidden="true">{{ request.user.first_name|default:request.user.username|first|upper }}</span>
  {% endif %}
</button>
