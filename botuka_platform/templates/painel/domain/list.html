{% extends 'painel/base.html' %}{% block content %}<main class="container py-4"><div class="d-flex flex-wrap justify-content-between gap-2"><h1>{{ titulo }}</h1>{% if novo_url %}<a class="btn btn-primary" href="{{ novo_url }}">Novo cadastro</a>{% endif %}</div><form class="row g-2 my-3"><div class="col"><input class="form-control" name="q" value="{{ request.GET.q }}" placeholder="Buscar"></div><div class="col-auto"><button class="btn btn-outline-primary">Buscar</button></div></form><div class="row g-3">{% for objeto in objetos %}<div class="col-12 col-md-6 col-xl-4"><article class="card h-100"><div class="card-body"><h2 class="h5">{{ objeto }}</h2>{% if objeto.status %}<span class="badge text-bg-secondary">{{ objeto.get_status_display }}</span>{% endif %}<div class="mt-3"><a href="{{ objeto.get_painel_url|default:'#' }}">Detalhes</a></div></div></article></div>{% empty %}<p>Nenhum registro encontrado.</p>{% endfor %}</div></main>{% endblock %}
