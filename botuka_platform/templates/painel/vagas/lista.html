{% extends 'painel/base.html' %}{% block content %}<div class="container py-4"><div class="d-flex justify-content-between"><h1>Vagas</h1><a href="{% url 'painel:vaga_criar' %}">Nova vaga</a></div>{% for vaga in vagas %}<article><a href="{% url 'painel:vaga_detalhe' vaga.uuid %}">{{ vaga.titulo }}</a> — {{ vaga.empresa }} — {{ vaga.get_status_display }}</article>{% empty %}<p>Nenhuma vaga cadastrada.</p>{% endfor %}</div>{% endblock %}
