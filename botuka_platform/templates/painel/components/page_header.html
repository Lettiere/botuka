<header class="panel-page-header"><div><nav class="panel-breadcrumb" aria-label="Breadcrumb"><a href="{% url 'painel:dashboard' %}">Painel</a>{% if breadcrumb %}<span>/</span><span>{{ breadcrumb }}</span>{% endif %}</nav><h1>{{ title }}</h1>{% if subtitle %}<p>{{ subtitle }}</p>{% endif %}</div><div class="panel-page-actions">{% if back_url %}<a class="panel-btn panel-btn--soft" href="{{ back_url }}"><i class="bi bi-arrow-left"></i> Voltar</a>{% elif back_url_name %}<a class="panel-btn panel-btn--soft" href="{% url back_url_name %}"><i class="bi bi-arrow-left"></i> Voltar</a>{% endif %}{% if action_url and action_label %}<a class="panel-btn" href="{{ action_url }}">{{ action_label }}</a>{% endif %}</div></header>
