{% extends "painel/base.html" %}{% load static %}{% block styles %}{{ block.super }}<link rel="stylesheet" href="{% static 'painel/css/turismo.css' %}">{% endblock %}
{% block painel_content %}<main class="tour-page"><div class="tour-wrap tour-wrap-narrow"><section class="tour-panel tour-confirm"><i class="bi bi-archive"></i><h1>Arquivar {{ config.label|lower }}?</h1><p><strong>{{ objeto }}</strong> deixará de aparecer nas listagens e páginas públicas. O histórico será preservado.</p><form method="post">{% csrf_token %}<a class="tour-btn tour-btn-light" href="{% url 'painel:turismo_entidade_detalhe' entidade objeto.uuid %}">Cancelar</a><button class="tour-btn tour-btn-danger" type="submit">Arquivar</button></form></section></div></main>{% endblock %}
