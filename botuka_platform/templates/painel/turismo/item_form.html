{% extends "painel/base.html" %}{% load static %}{% block styles %}{{ block.super }}<link rel="stylesheet" href="{% static 'painel/css/turismo.css' %}">{% endblock %}
{% block painel_content %}<main class="tour-page"><div class="tour-wrap tour-wrap-narrow"><nav class="tour-breadcrumb"><a href="{% url 'painel:turismo_local_etapa' local.uuid 6 %}">Galeria</a><i class="bi bi-chevron-right"></i><span>{{ titulo }}</span></nav><header class="tour-hero tour-hero-compact"><h1>{{ titulo }}</h1></header><form class="tour-form-card" method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_div }}<div class="tour-form-actions"><a class="tour-btn tour-btn-light" href="{% url 'painel:turismo_local_etapa' local.uuid 6 %}">Cancelar</a><button class="tour-btn tour-btn-primary" type="submit">Salvar</button></div></form></div></main>{% endblock %}
