{% extends "social/base.html" %}{% block social_content %}<header class="social-page-heading"><div><span>Descobrir</span><h1>{{ label }}</h1></div></header><section class="social-official-grid">{% for item in items %}<article class="social-content-card">{% if item.image %}<img src="{{ item.image }}" alt="">{% endif %}<h2>{{ item.title }}</h2><p>{{ item.summary|striptags|truncatewords:32 }}</p><a href="{% url 'social:official_detail' kind item.object.uuid|default:item.object.slug %}">Ver no Social</a></article>{% empty %}<p>Nenhum conteúdo público cadastrado.</p>{% endfor %}</section>{% endblock %}
