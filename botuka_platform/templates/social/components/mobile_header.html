<header class="social-mobile-header"><button class="social-icon-button" type="button" data-burger-open aria-label="Abrir menu"><i class="bi bi-list"></i></button><a class="social-brand" href="{% url 'social:home' %}"><span></span>BOTUKA</a><div class="social-header-actions"><a class="social-icon-button" href="{% url 'social:messages' %}" aria-label="Mensagens, {{ social_badges.mensagens }} não lidas"><i class="bi bi-chat-dots"></i><span class="social-badge" data-message-badge {% if not social_badges.mensagens %}hidden{% endif %}>{{ social_badges.mensagens }}</span></a><a class="social-icon-button" href="{% url 'social:notifications' %}" aria-label="Notificações, {{ social_badges.notificacoes }} não lidas"><i class="bi bi-bell"></i><span class="social-badge" data-notification-badge {% if not social_badges.notificacoes %}hidden{% endif %}>{{ social_badges.notificacoes }}</span></a></div></header>
