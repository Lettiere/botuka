<section class="social-stories" aria-labelledby="stories-title"><h2 id="stories-title" class="social-visually-hidden">Stories</h2><a class="social-story social-story-own" href="{% url 'social:story_create' %}"><span><i class="bi bi-plus-lg"></i></span><strong>Seu Story</strong></a>{% for story in active_stories %}<a class="social-story" href="{% url 'social:story_detail' story.uuid %}">{% if story.imagem %}<img src="{{ story.imagem.url }}" alt="Story de {{ story.autor.nome_publico }}">{% endif %}<strong>{{ story.autor.nome_publico }}</strong></a>{% endfor %}</section>
