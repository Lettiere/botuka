{% extends "social/base.html" %}{% block social_content %}<h1>Solicitações para seguir</h1>{% for item in requests %}<article class="social-content-card"><strong>{{ item.solicitante.nome_publico }}</strong><div class="social-actions"><form method="post" action="{% url 'social:follow_request_decide' item.uuid 'aprovar' %}">{% csrf_token %}<button type="submit">Aprovar</button></form><form method="post" action="{% url 'social:follow_request_decide' item.uuid 'recusar' %}">{% csrf_token %}<button type="submit">Recusar</button></form></div></article>{% empty %}<p>Nenhuma solicitação pendente.</p>{% endfor %}{% endblock %}
