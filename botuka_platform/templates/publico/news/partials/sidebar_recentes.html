{% if recentes %}<section class="article-sidebar-card"><span class="section-kicker">Agora no BOTUKA</span><h2>Notícias recentes</h2><div class="article-recent-list">{% for item in recentes %}<a href="{% url 'news_public:artigo' item.slug %}">{% if item.imagem_capa %}<img src="{{ item.imagem_capa.url }}" alt="" width="96" height="72" loading="lazy">{% else %}<span><i class="bi bi-newspaper" aria-hidden="true"></i></span>{% endif %}<div><small>{{ item.categoria.nome }} · {{ item.publicado_em|date:'d/m' }}</small><strong>{{ item.titulo }}</strong></div></a>{% endfor %}</div></section>{% endif %}
