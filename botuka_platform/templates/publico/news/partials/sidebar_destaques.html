{% if destaques %}<section class="article-sidebar-card article-sidebar-ranking"><span class="section-kicker">Seleção editorial</span><h2>Em destaque</h2><ol>{% for item in destaques %}<li><span>{{ forloop.counter|stringformat:'02d' }}</span><a href="{% url 'news_public:artigo' item.slug %}"><small>{{ item.categoria.nome }}</small><strong>{{ item.titulo }}</strong></a></li>{% endfor %}</ol></section>{% endif %}
