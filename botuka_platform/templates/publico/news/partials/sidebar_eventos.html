{% if eventos_sidebar %}<section class="article-sidebar-card article-events"><span class="section-kicker">Agenda da cidade</span><h2>Próximos eventos</h2>{% for evento in eventos_sidebar %}<a href="{{ evento.url }}"><time datetime="{{ evento.inicio|date:'Y-m-d' }}"><b>{{ evento.inicio|date:'d' }}</b><span>{{ evento.inicio|date:'M' }}</span></time><div><strong>{{ evento.titulo }}</strong><small>{{ evento.local|default:evento.origem }}</small></div></a>{% endfor %}<a class="article-sidebar-card__more" href="{% url 'events:lista' %}">Ver agenda completa <i class="bi bi-arrow-right" aria-hidden="true"></i></a></section>{% endif %}
