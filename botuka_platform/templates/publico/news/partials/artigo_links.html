{% if links_publicos %}
<section class="article-transparency article-links" aria-labelledby="article-links-title"><h2 id="article-links-title">Links relacionados</h2><div>
{% for link in links_publicos %}<a href="{{ link.url }}"{% if link.externo %} target="_blank" rel="noopener noreferrer{% if link.nofollow %} nofollow{% endif %}"{% elif link.nofollow %} rel="nofollow"{% endif %}><i class="bi bi-{% if link.externo %}box-arrow-up-right{% else %}arrow-right-circle{% endif %}" aria-hidden="true"></i><span><strong>{{ link.titulo }}</strong><small>{{ link.tipo }}{% if link.externo %} · site externo{% else %} · BOTUKA{% endif %}</small></span></a>{% endfor %}
</div></section>
{% endif %}
